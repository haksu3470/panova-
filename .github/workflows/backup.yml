name: Supabase Automatic Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Supabase Backup Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          npm install postgres
          node -e '
            const postgres = require("postgres");
            const fs = require("fs");
            async function run() {
              const sql = postgres(process.env.SUPABASE_DB_URL, { ssl: "require" });
              const tables = ["job_candidates", "job_requests", "employers", "staff_members", "tasks", "candidate_support_tickets"];
              let backup = {};
              for (let t of tables) {
                try {
                  backup[t] = await sql`SELECT * FROM ${sql(t)}`;
                } catch (err) {
                  console.log("Tablo okunamadı:", t, err.message);
                }
              }
              const filename = `panova_backup_${new Date().toISOString().slice(0,10)}.json`;
              fs.writeFileSync(filename, JSON.stringify(backup, null, 2));
              console.log("Yedek başarıyla alındı:", filename);
              await sql.end();
            }
            run().catch(console.log);
          '