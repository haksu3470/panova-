name: Supabase Automatic Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Backup Script
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          node -e '
            const http = require("http");
            console.log("Bağlantı testi ve yedekleme hazırlığı başlatıldı...");
            console.log("DB URL kontrolü:", process.env.SUPABASE_DB_URL ? "Mevcut" : "Bulunamadı");
          '