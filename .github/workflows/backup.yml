name: Supabase Automatic Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # SUPABASE_DB_URL is a repository secret: the Supabase Postgres URI
      # (Project Settings → Database → Connection string → URI, direct, port 5432).
      # The anon key is not a substitute. The 2026-11-09 failure was not a missing
      # secret (the log masks SUPABASE_DB_URL). require("postgres") was not a function.
      - name: Install backup client
        working-directory: scripts/backup
        run: npm install --omit=dev

      - name: Run Supabase backup
        working-directory: scripts/backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node --experimental-strip-types backup.mjs

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: panova-backup
          path: scripts/backup/out/*.json
          retention-days: 14
