name: Supabase Automatic Backup

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      # SUPABASE_DB_URL is a repository secret: Postgres URI from Supabase Connect.
      # GitHub Actions runners are IPv4-only; the direct host db.*.supabase.co is
      # IPv6-only, so connect ENETUNREACH fails. The backup script rewrites a
      # direct URI to the Session pooler using SUPABASE_DB_REGION (session mode,
      # port 5432). The secret may remain the direct URI or already be the
      # Session pooler URI. Do not use the anon/service role key.
      - name: Install backup client
        working-directory: scripts/backup
        run: npm install --omit=dev

      - name: Run Supabase backup
        working-directory: scripts/backup
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          SUPABASE_DB_REGION: eu-central-1
        run: node --experimental-strip-types backup.mjs

      - name: Upload backup artifact
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: panova-backup
          path: scripts/backup/out/*.json
          retention-days: 14
